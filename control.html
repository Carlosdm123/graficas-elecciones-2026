left:0;

bottom:0;

}

.slider:before{

bottom:3px;
background:white;
transition:.3s;

}

<script>

const CONTROL_PASSWORD="PRUEBA_MAYO_2026*";
const CONTROL_AUTH_KEY="graficas-elecciones-2026-auth-date";

function getAccessDate(){

const now=new Date();
const colombiaNow=new Date(
now.toLocaleString("en-US",{timeZone:"America/Bogota"})
);

const year=colombiaNow.getFullYear();
const month=String(colombiaNow.getMonth()+1).padStart(2,"0");
const day=String(colombiaNow.getDate()).padStart(2,"0");

return year+"-"+month+"-"+day;

}

function unlockControl(){
document.getElementById("loginOverlay").style.display="none";
}

function lockControl(){
const overlay=document.getElementById("loginOverlay");
const input=document.getElementById("loginPassword");
document.getElementById("loginError").innerText="";
input.value="";
overlay.style.display="flex";
input.focus();
}

function validateControlAccess(){

if(localStorage.getItem(CONTROL_AUTH_KEY)===getAccessDate()){
unlockControl();
}

}

function submitLogin(){

const input=document.getElementById("loginPassword");
const error=document.getElementById("loginError");

if(input.value===CONTROL_PASSWORD){
localStorage.setItem(CONTROL_AUTH_KEY,getAccessDate());
error.innerText="";
unlockControl();
return;
}

error.innerText="Contraseña incorrecta";
input.value="";
input.focus();

}

document.getElementById("loginButton").addEventListener("click",submitLogin);
document.getElementById("loginPassword").addEventListener("keydown",(event)=>{
if(event.key==="Enter"){
submitLogin();
}
});

document.getElementById("logoutButton").addEventListener("click",()=>{
localStorage.removeItem(CONTROL_AUTH_KEY);
lockControl();
});

const ably = new Ably.Realtime("bOKecA.DM-G9g:YojB__4e1uHIMPer7ANbwW7xF8jRunVc9TW7ALFLwpQ");
const channelPrefix = "graficas-elecciones-2026-universal-v2";
const roleChannel = ably.channels.get(channelPrefix+"-roles");
const bannerChannel = ably.channels.get(channelPrefix+"-banners");
const candidateChannel = ably.channels.get(channelPrefix+"-candidatos");
const moscaChannel = ably.channels.get(channelPrefix+"-mosca");
const tickerChannel = ably.channels.get(channelPrefix+"-ticker");
const securityChannel = ably.channels.get(channelPrefix+"-seguridad");

document.getElementById("logoutAllButton").addEventListener("click",()=>{
securityChannel.publish("control",{
action:"logoutAll",
createdAt:Date.now()
});
localStorage.removeItem(CONTROL_AUTH_KEY);
lockControl();
});

const connectionDot=document.getElementById("connectionDot");

ably.connection.on((stateChange)=>{

if(stateChange.current==="connected"){
connectionDot.style.background="#00ff7a";
}

if(stateChange.current==="connecting" || stateChange.current==="disconnected"){
connectionDot.style.background="#ffaa00";
}

if(stateChange.current==="suspended" || stateChange.current==="failed"){
connectionDot.style.background="#ff0033";
}

});

securityChannel.subscribe("control",(message)=>{

const data=message.data;

if(data.action==="logoutAll"){
localStorage.removeItem(CONTROL_AUTH_KEY);
lockControl();
}

});

validateControlAccess();

function showTab(tabName){

document.querySelectorAll(".tabButton").forEach((button)=>{
button.classList.toggle("active",button.dataset.tab===tabName);
});

document.querySelectorAll(".tabPanel").forEach((panel)=>{
panel.classList.toggle("active",panel.id==="tab-"+tabName);
});

const activeButton=document.querySelector(".tabButton.active");
document.getElementById("controllerTitle").innerText=activeButton.dataset.title;

}

function restoreActiveDeleted(){

const activeButton=document.querySelector(".tabButton.active");
const activeTab=activeButton ? activeButton.dataset.tab : "";

if(activeTab==="rol"){
restoreDeletedBanners();
}

if(activeTab==="banners"){
restoreDeletedNewsBanners();
}

if(activeTab==="candidatos"){
restoreDeletedCandidateBanners();
}

if(activeTab==="ticker"){
restoreDeletedTickerNotes();
}

}

/* TITULOS PREESTABLECIDOS */

let banners=[

{name:"ALEJANDRA TRUJILLO",role:"DIRECTORA DE PROYECTOS FESCOL"},
{name:"ANDRÉS OSORIO GUILLOT",role:"COORDINADOR DE NEWSLETTER EN EL ESPECTADOR"},
{name:"CARLOS CHACÓN",role:"DIRECTOR ICP HERNÁN ECHAVARRÍA"},
{name:"CINDY MORALES",role:"EDITORA DE COLOMBIA + 20"},
{name:"DANIEL VALERO",role:"EDITOR POLÍTICO DE EL ESPECTADOR"},
{name:"DAVID EFRÉN ORTEGA",role:"PERIODISTA POLÍTICO DE EL ESPECTADOR"},
{name:"ÉLBER GUTIÉREZ ROA",role:"PRODUCTOR GENERAL DE EL ESPECTADOR"},
{name:"GUSTAVO MONTES",role:"PERIODISTA DE EL ESPECTADOR"},
{name:"KAREN VANESSA QUINTERO",role:"PERIODISTA DE EL ESPECTADOR"},
{name:"LARIZA PIZANO",role:"COLUMNISTA DE EL ESPECTADOR"},
{name:"LEÓN VALENCIA",role:"DIRECTOR DE LA FUNDACIÓN PARES"},
{name:"LUIS ERNESTO GÓMEZ",role:"ANALISTA"},
{name:"MARCELA OSORIO",role:"EDITORA WEB DE EL ESPECTADOR"},
{name:"MARÍA ALEJANDRA VICTORINO",role:"ANALISTA EXTITUTO"},
{name:"MARIA JOSÉ BARRIOS FIGUEROA",role:"PERIODISTA POLÍTICA DE EL ESPECTADOR"},
{name:"NICOLÁS DÍAZ",role:"DIRECTOR DE EXTITUTO"},
{name:"RAMIRO BEJARANO",role:"COLUMNISTA DE EL ESPECTADOR"}

];

let activeIndex=null;
let autoOffTimer=null;
let deletedBanners=[];

function render(){

const panel=document.getElementById("panel");

panel.innerHTML="";

banners.forEach((item,i)=>{

const row=document.createElement("div");
row.className="item";

const switchWrap=document.createElement("label");
switchWrap.className="switch";

const toggle=document.createElement("input");
toggle.type="checkbox";
toggle.checked=(activeIndex===i);
toggle.onchange=()=>toggleBanner(i);

const slider=document.createElement("span");
slider.className="slider";

switchWrap.appendChild(toggle);
switchWrap.appendChild(slider);

const label=document.createElement("span");
label.innerText=item.name;

const del=document.createElement("button");
del.innerText="Borrar";
del.className="deleteBtn";
del.onclick=()=>deleteBanner(i);

row.appendChild(switchWrap);
row.appendChild(label);
row.appendChild(del);

panel.appendChild(row);

});

}

function toggleBanner(i){

if(activeIndex===i){

roleChannel.publish("banner",{action:"hide"});
activeIndex=null;
clearTimeout(autoOffTimer);
render();
return;

}

activeIndex=i;

roleChannel.publish("banner",{
action:"show",
name:banners[i].name,
role:banners[i].role
});

clearTimeout(autoOffTimer);

autoOffTimer=setTimeout(()=>{

roleChannel.publish("banner",{action:"hide"});
activeIndex=null;
render();

},11000);

render();

}

function deleteBanner(i){

const deleted=banners.splice(i,1)[0];

if(deleted){
deletedBanners.push({
item:deleted,
index:i
});
}

if(activeIndex===i){

roleChannel.publish("banner",{action:"hide"});
activeIndex=null;

}

if(activeIndex!==null && i<activeIndex){
activeIndex--;
}

render();

}

function restoreDeletedBanners(){

if(deletedBanners.length===0) return;

const activeItem=activeIndex!==null ? banners[activeIndex] : null;

deletedBanners
.sort((a,b)=>a.index-b.index)
.forEach((entry)=>{
const index=Math.min(entry.index,banners.length);
banners.splice(index,0,entry.item);

});

banners.sort((a,b)=>a.name.localeCompare(b.name,"es",{sensitivity:"base"}));
activeIndex=activeItem ? banners.indexOf(activeItem) : null;

deletedBanners=[];
render();

}

const name=document.getElementById("newName").value.trim();
const role=document.getElementById("newRole").value.trim();

if(!name || !role) return;

banners.push({
name:name,
role:role
});

document.getElementById("newName").value="";
document.getElementById("newRole").value="";

updateCounter(nameInput,countName);
updateCounter(roleInput,countRole);

render();

}

const url="https://carlosdm123.github.io/graficas-elecciones-2026/overlay.html";

navigator.clipboard.writeText(url);

alert("URL copiada para vMix");

}

render();

const nameInput=document.getElementById("newName");
const roleInput=document.getElementById("newRole");

const countName=document.getElementById("countName");
const countRole=document.getElementById("countRole");

function updateCounter(input,count){

const len=input.value.length;
const max=input.maxLength;

count.innerText=len+" / "+max;

if(len>=max){
input.style.border="2px solid #ff0033";
}else{
input.style.border="1px solid #555";
}

}

nameInput.addEventListener("input",()=>updateCounter(nameInput,countName));
roleInput.addEventListener("input",()=>updateCounter(roleInput,countRole));

let newsBanners=[

"Registraduría Nacional confirma apertura de mesas con total normalidad en las principales ciudades del país durante la jornada",

let deletedNewsBanners=[];

function renderNewsBanners(){

const panel=document.getElementById("bannerPanel");

panel.innerHTML="";

newsBanners.forEach((text,i)=>{

const row=document.createElement("div");
row.className="item";

const switchWrap=document.createElement("label");
switchWrap.className="switch";

const toggle=document.createElement("input");
toggle.type="checkbox";

const moscaToggle=document.getElementById("moscaToggle");
const moscaHoraInput=document.getElementById("moscaHora");
const moscaHoraButton=document.getElementById("moscaHoraButton");
const moscaLoopSelect=document.getElementById("moscaLoopMin");
const moscaStatus=document.getElementById("moscaStatus");
const moscaCountdown=document.getElementById("moscaCountdown");
let moscaCountdownInterval=null;
let moscaNextRestartAt=null;

function formatMoscaCountdown(seconds){

seconds=Math.max(0,seconds);

const min=Math.floor(seconds/60);
const sec=seconds%60;

return String(min).padStart(2,"0")+":"+String(sec).padStart(2,"0");

}

function updateMoscaCountdown(){

if(!moscaToggle.checked){
moscaCountdown.innerText="--:--";
return;
}

const loopMinutes=parseInt(moscaLoopSelect.value || 0);

if(loopMinutes<=0){
moscaCountdown.innerText="Sin repetir";
return;
}

if(!moscaNextRestartAt){
moscaCountdown.innerText="--:--";
return;
}

const remaining=Math.ceil((moscaNextRestartAt-Date.now())/1000);

moscaCountdown.innerText=formatMoscaCountdown(remaining);

if(remaining<=0){
startMoscaCountdown();
}

}

function stopMoscaCountdown(){

if(moscaCountdownInterval){
clearInterval(moscaCountdownInterval);
moscaCountdownInterval=null;
}

moscaNextRestartAt=null;
moscaCountdown.innerText="--:--";

}

function startMoscaCountdown(){

if(moscaCountdownInterval){
clearInterval(moscaCountdownInterval);
moscaCountdownInterval=null;
}

const loopMinutes=parseInt(moscaLoopSelect.value || 0);

if(!moscaToggle.checked || loopMinutes<=0){
moscaNextRestartAt=null;
moscaCountdown.innerText=moscaToggle.checked ? "Sin repetir" : "--:--";
return;
}

const animationSeconds=50;
moscaNextRestartAt=Date.now()+((animationSeconds+(loopMinutes*60))*1000);

updateMoscaCountdown();
moscaCountdownInterval=setInterval(updateMoscaCountdown,1000);

}

moscaToggle.addEventListener("change",()=>{
moscaChannel.publish("control",{
action:moscaToggle.checked ? "on" : "off"
});

if(moscaToggle.checked){
startMoscaCountdown();
}else{
stopMoscaCountdown();
}

});

function sendMoscaHora(){
moscaChannel.publish("control",{
action:"updateHora",
hora:moscaHoraInput.value
});
moscaStatus.innerText="✔ "+moscaHoraInput.value;
}

function sendMoscaLoop(){
moscaChannel.publish("control",{
action:"updateLoop",
minutos:moscaLoopSelect.value
});

if(moscaToggle.checked){
startMoscaCountdown();
}else{
updateMoscaCountdown();
}

}

moscaHoraInput.addEventListener("change",sendMoscaHora);
moscaLoopSelect.addEventListener("change",sendMoscaLoop);

moscaHoraButton.addEventListener("click",()=>{
moscaHoraInput.focus();

if(typeof moscaHoraInput.showPicker==="function"){
moscaHoraInput.showPicker();
}

});

sendMoscaHora();
sendMoscaLoop();

let tickerNotes=[

const tickerToggle=document.getElementById("tickerToggle");
const tickerNotesPanel=document.getElementById("tickerNotes");
const tickerAddButton=document.getElementById("tickerAddButton");

function getTickerPayload(){
return tickerNotes
.map((text)=>text.trim())
.filter(Boolean)
.map((text)=>text.toUpperCase());
}

function publishTicker(){

const notes=getTickerPayload();

if(!tickerToggle.checked || notes.length===0){
tickerChannel.publish("control",{action:"hide"});
return;
}

tickerChannel.publish("control",{
action:"show",
notes:notes
});

}

function renderTickerNotes(){

tickerNotesPanel.innerHTML="";

tickerNotes.forEach((text,i)=>{

const note=document.createElement("div");
note.className="tickerNote";

const top=document.createElement("div");
top.className="tickerNoteTop";

const textarea=document.createElement("textarea");
textarea.maxLength=130;
textarea.value=text;
textarea.placeholder="Texto del ticker";

const del=document.createElement("button");
del.innerText="Borrar";
del.className="deleteBtn";
del.type="button";
del.onclick=()=>{
const deleted=tickerNotes.splice(i,1)[0];

if(deleted!==undefined){
deletedTickerNotes.push({
item:deleted,
index:i
});
}

if(tickerNotes.length===0){
tickerNotes.push("");
}
renderTickerNotes();
publishTicker();
};

top.appendChild(textarea);
top.appendChild(del);

const counter=document.createElement("div");
counter.className="counter";

const error=document.createElement("div");
error.className="error";
error.innerText="límite máximo de caracteres";

function updateTickerCounter(){
const len=textarea.value.length;
counter.innerText=len+" / 130";

if(len>110){
counter.classList.add("warning");
textarea.classList.add("limit");
}else{
counter.classList.remove("warning");
textarea.classList.remove("limit");
}

error.style.display=len>=130 ? "block" : "none";
}

textarea.addEventListener("input",()=>{
tickerNotes[i]=textarea.value;
updateTickerCounter();
publishTicker();
});

note.appendChild(top);
note.appendChild(counter);
note.appendChild(error);
tickerNotesPanel.appendChild(note);

updateTickerCounter();

});

}

function restoreDeletedTickerNotes(){

if(deletedTickerNotes.length===0) return;

if(tickerNotes.length===1 && tickerNotes[0].trim()===""){
tickerNotes=[];
}

deletedTickerNotes
.sort((a,b)=>a.index-b.index)
.forEach((entry)=>{
const index=Math.min(entry.index,tickerNotes.length);
tickerNotes.splice(index,0,entry.item);
});

deletedTickerNotes=[];
renderTickerNotes();

}

tickerToggle.addEventListener("change",publishTicker);
tickerAddButton.addEventListener("click",()=>{
tickerNotes.push("");
renderTickerNotes();
});

renderTickerNotes();
