<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controlador Universal Elecciones 2026</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>

</head>

<body class="controller-body">


<!-- ====================================== -->
<!-- HEADER -->
<!-- ====================================== -->

<header class="universal-header">

<div class="header-left">

<img
src="assets/universal/logo-controlador.png"
class="header-logo">

<div class="header-title">
CONTROLADOR UNIVERSAL ELECCIONES 2026
</div>

</div>

<div id="connectionDot" class="connection-dot"></div>

</header>


<!-- ====================================== -->
<!-- PREVIEW -->
<!-- ====================================== -->

<section class="preview-section">

<div class="preview-title">
PREVISUALIZADOR GENERAL
</div>

<div class="preview-container">

<div class="preview-inner">

<iframe src="overlay.html"></iframe>

</div>

</div>


<div class="preview-buttons">

<button onclick="openOverlay()">
Abrir overlay
</button>

<button onclick="copyOverlay()">
Copiar URL para vMix
</button>

</div>

</section>


<!-- ====================================== -->
<!-- GRID -->
<!-- ====================================== -->

<section class="controls-grid">


<!-- ====================================== -->
<!-- BANNERS -->
<!-- ====================================== -->

<div class="control-card">

<h2>CONTROL DE BANNERS</h2>

<div class="panel" id="bannerPanel"></div>

<div class="inputArea">

<textarea
id="newBannerText"
maxlength="130"></textarea>

<div class="counter" id="bannerCounter">
0 / 130
</div>

<button
class="addBtn"
onclick="addBanner()">

Agregar

</button>

</div>

</div>


<!-- ====================================== -->
<!-- ROLES -->
<!-- ====================================== -->

<div class="control-card">

<h2>CONTROL DE TÍTULOS DE ROL</h2>

<div class="panel" id="rolesPanel"></div>

<div class="inputArea">

<input
id="newRoleName"
maxlength="70"
placeholder="Nombre">

<div class="counter" id="roleNameCounter">
0 / 70
</div>


<input
id="newRoleText"
maxlength="100"
placeholder="Rol">

<div class="counter" id="roleTextCounter">
0 / 100
</div>


<button
class="addBtn"
onclick="addRole()">

Agregar

</button>

</div>

</div>


<!-- ====================================== -->
<!-- CANDIDATOS -->
<!-- ====================================== -->

<div class="control-card">

<h2>CONTROL DE CANDIDATOS</h2>

<div class="panel" id="candidatePanel"></div>

<div class="inputArea">

<textarea
id="newCandidateText"
maxlength="130"></textarea>

<div class="counter" id="candidateCounter">
0 / 130
</div>

<button
class="addBtn"
onclick="addCandidateBanner()">

Agregar

</button>

</div>

</div>


<!-- ====================================== -->
<!-- MOSCA -->
<!-- ====================================== -->

<div class="control-card">

<h2>CONTROL MOSCA ANÁLISIS</h2>

<div class="mosca-controls">


<label class="switch">

<input
type="checkbox"
id="moscaToggle">

<span class="slider"></span>

</label>


<div class="mosca-block">

<div>Cierre de votaciones:</div>

<input
type="time"
id="hora"
value="16:00">

</div>


<div class="mosca-block">

<div>Repetición (minutos)</div>

<select id="loopMin">

<option value="0">0</option>
<option value="1">1</option>
<option value="2" selected>2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>

</select>

</div>

</div>

</div>

</section>


<script src="animation.js"></script>

</body>
</html>
