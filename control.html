<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>

<style>
body{
background:#1e1e1e;
color:#e6e6e6;
font-family:sans-serif;
margin:40px;
display:flex;
}

.version{
width:18px;
height:18px;
border-radius:50%;
background:#666;
margin-right:20px;
margin-top:5px;
}

.container{
flex:1;
}

.tabs{
width:854px;
margin:0 auto 20px auto;
display:flex;
gap:10px;
}

.tabBtn{
background:#2e2e2e;
color:white;
border:none;
padding:10px 16px;
cursor:pointer;
border-radius:4px;
}

.tabBtn.active{
background:#2c8f6b;
}

.controlSection{
display:none;
}

.controlSection.active{
display:block;
}

.previewTitle{
width:854px;
margin:0 auto 12px auto;
font-size:26px;
font-weight:700;
letter-spacing:1px;
color:white;
text-align:left;
}

.preview{
width:854px;
height:480px;
border:4px solid white;
margin:auto;
overflow:hidden;
position:relative;
</html>
