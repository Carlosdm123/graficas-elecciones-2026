.tabButton{
background:#2e2e2e;

padding:10px 12px;
cursor:pointer;
border-radius:4px;
font-size:14px;
font-weight:700;
}

.tabButton:hover{
background:#3a3a3a;
}

.tabButton.active{
background:#2c8f6b;
border-color:#38a77f;
color:white;
}

.tabPanel{
display:none;
}

.tabPanel.active{
display:block;
}

.previewTitle{
width:854px;
margin:0 auto 12px auto;
font-size:26px;
font-weight:700;
letter-spacing:1px;
color:white;
text-align:left;
}

.preview{
width:854px;
height:480px;
border:4px solid white;
margin:auto;
overflow:hidden;
}

iframe{
width:1920px;
height:1080px;
transform:scale(0.444);
transform-origin:top left;
border:none;
}

.previewButtons{
width:854px;
margin:15px auto 0 auto;
display:flex;
gap:10px;
justify-content:center;
}

.previewButtons button{
background:#2e2e2e;
color:white;
border:none;
padding:8px 14px;
cursor:pointer;
border-radius:4px;
}

.previewButtons button:hover{
background:#3d3d3d;
}

/* PANEL CON SCROLL */

.panel{
width:854px;
margin:auto;
margin-top:30px;
max-height:620px;
overflow-y:auto;
padding-right:4px;
}

.item{
display:flex;
align-items:center;
justify-content:space-between;
margin:10px 0;
background:#2a2a2a;
padding:10px;
border-radius:6px;
}

.item span{
flex:1;
margin-left:12px;
font-size:14px;
}

.candidateSelect{
background:#1f1f1f;
color:white;
border:1px solid #555;
padding:6px 10px;
border-radius:4px;
min-width:240px;
}

.switch{
position:relative;
display:inline-block;
width:42px;
height:22px;
}

.switch input{
display:none;
}

.slider{
position:absolute;
cursor:pointer;
top:0;
left:0;
right:0;
bottom:0;
background:#555;
transition:.3s;
border-radius:22px;
}

.slider:before{
position:absolute;
content:"";
height:16px;
width:16px;
left:3px;
bottom:3px;
background:white;
transition:.3s;
border-radius:50%;
}

input:checked + .slider{
background:#2c8f6b;
}

input:checked + .slider:before{
transform:translateX(20px);
}

.deleteBtn{
margin-left:10px;
background:#444;
color:white;
border:none;
padding:4px 8px;
cursor:pointer;
border-radius:4px;
}

.deleteBtn:hover{
background:#aa3333;
}

.inputArea{
width:600px;
margin:40px auto;
text-align:center;
}

.inputArea input{
width:100%;
padding:10px;
margin-bottom:4px;
font-size:14px;
background:#2a2a2a;
color:white;
border:1px solid #555;
border-radius:6px;
}

.inputArea textarea{
width:100%;
height:120px;
padding:12px;
resize:none;
font-family:sans-serif;
font-size:14px;
background:#2a2a2a;
color:white;
border:1px solid #555;
border-radius:6px;
box-sizing:border-box;
}

.inputArea textarea.limit{
border-color:#cc4444;
background:#3a1e1e;
}

.counter{
font-size:12px;
margin-bottom:8px;
text-align:right;
color:#aaa;
}

.counter.warning{
color:#ff5555;
}

.error{
color:#ff4444;
font-size:12px;
margin-top:5px;
display:none;
}

.addBtn{
margin-top:10px;
padding:8px 18px;
background:#2c8f6b;
border:none;
color:white;
cursor:pointer;
border-radius:4px;
}

.addBtn:hover{
background:#38a77f;
}

.moscaControl{
width:854px;
margin:30px auto 0 auto;
display:flex;
flex-direction:column;
align-items:center;
gap:16px;
}

.moscaSwitch{
width:70px;
height:34px;
position:relative;
}

.moscaSwitch input{
opacity:0;
}

.moscaSwitch .slider{
border-radius:34px;
}

.moscaSwitch .slider:before{
height:26px;
width:26px;
left:4px;
bottom:4px;
}

.moscaSwitch input:checked + .slider:before{

.moscaTimeBox{
display:flex;
gap:10px;
align-items:center;

.moscaTimeBox input[type="time"],

.moscaStatus{

}

.moscaCountdown{

color:#00e676;
font-size:14px;
font-weight:700;
}

</style>
</head>

const moscaToggle=document.getElementById("moscaToggle");

const moscaCountdown=document.getElementById("moscaCountdown");
let moscaCountdownInterval=null;
let moscaNextRestartAt=null;

function formatMoscaCountdown(seconds){

seconds=Math.max(0,seconds);

const min=Math.floor(seconds/60);
const sec=seconds%60;

return String(min).padStart(2,"0")+":"+String(sec).padStart(2,"0");

}

function updateMoscaCountdown(){

if(!moscaToggle.checked){
moscaCountdown.innerText="--:--";
return;
}

const loopMinutes=parseInt(moscaLoopSelect.value || 0);

if(loopMinutes<=0){
moscaCountdown.innerText="Sin repetir";
return;
}

if(!moscaNextRestartAt){
moscaCountdown.innerText="--:--";
return;
}

const remaining=Math.ceil((moscaNextRestartAt-Date.now())/1000);

moscaCountdown.innerText=formatMoscaCountdown(remaining);

if(remaining<=0){
startMoscaCountdown();
}

}

function stopMoscaCountdown(){

if(moscaCountdownInterval){
clearInterval(moscaCountdownInterval);
moscaCountdownInterval=null;
}

moscaNextRestartAt=null;
moscaCountdown.innerText="--:--";

}

function startMoscaCountdown(){

if(moscaCountdownInterval){
clearInterval(moscaCountdownInterval);
moscaCountdownInterval=null;
}

const loopMinutes=parseInt(moscaLoopSelect.value || 0);

if(!moscaToggle.checked || loopMinutes<=0){
moscaNextRestartAt=null;
moscaCountdown.innerText=moscaToggle.checked ? "Sin repetir" : "--:--";
return;
}

const animationSeconds=50;
moscaNextRestartAt=Date.now()+((animationSeconds+(loopMinutes*60))*1000);

updateMoscaCountdown();
moscaCountdownInterval=setInterval(updateMoscaCountdown,1000);

}

moscaToggle.addEventListener("change",()=>{
moscaChannel.publish("control",{
action:moscaToggle.checked ? "on" : "off"
});

if(moscaToggle.checked){
startMoscaCountdown();
}else{
stopMoscaCountdown();
}

});

function sendMoscaHora(){
moscaChannel.publish("control",{
action:"updateHora",
hora:moscaHoraInput.value
});
moscaStatus.innerText="✔ "+moscaHoraInput.value;
}

function sendMoscaLoop(){
moscaChannel.publish("control",{
action:"updateLoop",
minutos:moscaLoopSelect.value
});

if(moscaToggle.checked){
startMoscaCountdown();
}else{
updateMoscaCountdown();
}

}

moscaHoraInput.addEventListener("change",sendMoscaHora);
moscaLoopSelect.addEventListener("change",sendMoscaLoop);

sendMoscaHora();
sendMoscaLoop();

</script>

</body>
</html>
