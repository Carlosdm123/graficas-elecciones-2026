<script src="animation.js"></script>

<script>

/* ===================================== */
/* ABLY */
/* ===================================== */

const ably = new Ably.Realtime({
key:"bOKecA.DM-G9g:YojB__4e1uHIMPer7ANbwW7xF8jRunVc9TW7ALFLwpQ"
});

const channel = ably.channels.get(
"ably-elecciones-completo"
);

/* ===================================== */
/* HELPERS */
/* ===================================== */

function hideImmediately(el){

el.style.opacity="0";

}

/* ===================================== */
/* ELEMENTS */
/* ===================================== */

const normalBanner =
document.getElementById("normalBanner");

const rolesBanner =
document.getElementById("rolesBanner");

const candidatosBanner =
document.getElementById("candidatosBanner");

/* ===================================== */
/* STATES */
/* ===================================== */

let normalVisible=false;
let rolesVisible=false;
let candidatosVisible=false;

/* ===================================== */
/* INITIAL RESET */
/* ===================================== */

hideImmediately(normalBanner);
hideImmediately(rolesBanner);
hideImmediately(candidatosBanner);

/* ===================================== */
/* CHANNEL */
/* ===================================== */

channel.subscribe("control",(message)=>{

const data = message.data;

/* ===================================== */
/* BANNER */
/* ===================================== */

if(data.module === "banner"){

if(data.action === "show"){

if(normalVisible){

hideBanner(normalBanner);

setTimeout(()=>{

normalBanner.querySelector(
".bannerText"
).innerText = data.text;

normalBanner.style.opacity="1";

startBanner(normalBanner);

normalVisible=true;

},3500);

}else{

normalBanner.querySelector(
".bannerText"
).innerText = data.text;

normalBanner.style.opacity="1";

startBanner(normalBanner);

normalVisible=true;

}

}

if(data.action === "hide"){

if(!normalVisible) return;

hideBanner(normalBanner);

setTimeout(()=>{

hideImmediately(normalBanner);

normalVisible=false;

},1500);

}

}

/* ===================================== */
/* ROLES */
/* ===================================== */

if(data.module === "roles"){

if(data.action === "show"){

const textHTML = `
<div class="nameLine">
${data.name.toUpperCase()}
</div>

<div class="roleLine">
${data.role.toUpperCase()}
</div>
`;

if(rolesVisible){

hideBanner(rolesBanner);

setTimeout(()=>{

rolesBanner.querySelector(
".bannerText"
).innerHTML = textHTML;

rolesBanner.style.opacity="1";

startBanner(rolesBanner);

rolesVisible=true;

},3500);

}else{

rolesBanner.querySelector(
".bannerText"
).innerHTML = textHTML;

rolesBanner.style.opacity="1";

startBanner(rolesBanner);

rolesVisible=true;

}

}

if(data.action === "hide"){

if(!rolesVisible) return;

hideBanner(rolesBanner);

setTimeout(()=>{

hideImmediately(rolesBanner);

rolesVisible=false;

},1500);

}

}

/* ===================================== */
/* CANDIDATOS */
/* ===================================== */

if(data.module === "candidatos"){

if(data.action === "show"){

const candidateImg =
candidatosBanner.querySelector(
".candidateImg"
);

candidateImg.src =
"assets/candidatos/" + data.candidate;

if(candidatosVisible){

hideBanner(candidatosBanner);

setTimeout(()=>{

candidatosBanner.querySelector(
".bannerText"
).innerText = data.text;

candidatosBanner.style.opacity="1";

startBanner(candidatosBanner,true);

candidatosVisible=true;

},3500);

}else{

candidatosBanner.querySelector(
".bannerText"
).innerText = data.text;

candidatosBanner.style.opacity="1";

startBanner(candidatosBanner,true);

candidatosVisible=true;

}

}

if(data.action === "hide"){

if(!candidatosVisible) return;

hideBanner(candidatosBanner);

setTimeout(()=>{

hideImmediately(candidatosBanner);

candidatosVisible=false;

},1500);

}

}

/* ===================================== */
/* MOSCA */
/* ===================================== */

if(data.module === "mosca"){

if(data.action === "on"){

stopMosca();

setTimeout(()=>{

startMosca();

},80);

}

if(data.action === "off"){

stopMosca();

}

if(data.action === "updateHora"){

horaCierre = data.hora;

updateTexto();

}

if(data.action === "updateLoop"){

minutosLoop =
parseInt(data.minutos || 0);

}

}

});

</script>
